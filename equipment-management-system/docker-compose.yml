services:
  postgres:
    image: postgres:16-alpine
    container_name: equipment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: equipment_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - equipment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d equipment_management"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  equipment_pgdata:
